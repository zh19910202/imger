                function showWatermark(args) {
                    const {textAlign='center', textBaseline='middle', font='28px Arial,sans-serif,Microsoft Yahei', fillStyle='rgba(0, 0, 0, 0.2)', strokeStyle='rgba(255, 255, 255, 0.3)', rotate=-45, zIndex=10000, content='Watermark', } = args;

                    const canvas = document.createElement('canvas');
                    const sizes = [[400, 300], [500, 370], [600, 440]]
                    let[width,height] = sizes[0]
                    let len = content.length
                    if (len > 18 && len < 30) {
                        [width,height] = sizes[1]
                    } else if (len >= 30) {
                        [width,height] = sizes[2]
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    if (!ctx || !container) {
                        return;
                    }
                    ctx.textAlign = textAlign;
                    ctx.textBaseline = textBaseline;
                    ctx.font = font;
                    ctx.translate(width / 2, height / 2);
                    ctx.rotate((Math.PI / 180) * rotate);
                    ctx.translate(-width / 2, -height / 2);
                    ctx.strokeStyle = strokeStyle;
                    ctx.lineWidth = 0.5;
                    ctx.strokeText(content, width / 2, height / 2);
                    ctx.fillStyle = fillStyle;
                    ctx.fillText(content, width / 2, height / 2);

              top:0;
              left:0;
              bottom:0;
              right:0;
              width:100%;
              height:100%;
              z-index:${zIndex};
              pointer-events:none;
              background-repeat:repeat;
              background-image:url('${base64Url}')`;

                    watermarkDiv.classList.add('__wm');

                    if (!__wm) {
                        container.insertBefore(watermarkDiv, container.firstChild);

                            if ((__wm && __wm.getAttribute('style') !== styleStr) || !__wm) {
                                // 避免一直触发
                                mo?.disconnect();
                                mo = null;
                                showWatermark(JSON.parse(JSON.stringify(args)));
                            }
                        }
                        );

                        mo.observe(container, {
                            // attributes: true,
                            subtree: true,
                            childList: true,
                        });
                    }
